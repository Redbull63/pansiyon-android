name: APK Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sistem Paketleri
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache python3-venv \
            libltdl-dev gettext autopoint

      - name: Python Paketleri
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: bz-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Derle
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          export BUILDOZER_WARN_ON_ROOT=0
          export ANDROID_ACCEPT_SDK_LICENSE=1
          buildozer android debug 2>&1 | tee full.log

      - name: Son 250 Satır (Her Durumda Göster)
        if: always()
        run: |
          echo "════════════════════════════════════════"
          echo "SON 250 SATIR — BUILD LOG"
          echo "════════════════════════════════════════"
          tail -250 full.log
          echo "════════════════════════════════════════"
          echo "bin/ İÇERİĞİ:"
          ls -la bin/ || true
          echo "════════════════════════════════════════"

      - name: APK Yükle
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
          if-no-files-found: warn

      - name: Log Yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: full.log
          retention-days: 7
