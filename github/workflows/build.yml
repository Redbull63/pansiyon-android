name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Depoyu Al
        uses: actions/checkout@v4

      - name: Önbellek (SDK/NDK/Gradle)
        uses: actions/cache@v4
        with:
          path: |
            /root/.buildozer
            /root/.gradle
          key: bz-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: bz-${{ runner.os }}-

      - name: Buildozer Sürüm Kontrolü
        run: |
          echo "════════════════════════════════════════"
          echo "Python: $(python3 --version)"
          echo "Java:   $(java -version 2>&1 | head -1)"
          echo "Buildozer: $(buildozer --version)"
          echo "Android SDK: $ANDROID_HOME"
          echo "Android NDK: $ANDROID_NDK_HOME"
          echo "════════════════════════════════════════"

      - name: APK Derle
        run: |
          buildozer -v android debug 2>&1

      - name: Sonuçları Göster
        if: always()
        run: |
          echo "════════════════════════════════════════"
          echo "BIN/ İÇERİĞİ:"
          ls -la bin/ 2>&1 || echo "bin/ klasörü yok"
          echo "════════════════════════════════════════"

      - name: APK Yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PansiyonNobet-APK
          path: |
            bin/*.apk
            /github/workspace/bin/*.apk
          retention-days: 90
          if-no-files-found: warn
