name: APK Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Depoyu Al
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sistem Bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache python3-venv \
            libltdl-dev gettext autopoint

      - name: Pip Paketleri
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv

      - name: Buildozer Önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v3-${{ runner.os }}-

      - name: APK Derle
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          export BUILDOZER_WARN_ON_ROOT=0
          export ANDROID_ACCEPT_SDK_LICENSE=1
          buildozer -v android debug 2>&1 | tee buildozer_full.log
          echo "buildozer_exit=$?" >> $GITHUB_OUTPUT

      - name: Hata Olursa Logu Göster
        if: steps.build.outcome == 'failure'
        run: |
          echo "❌ DERLEME BAŞARISIZ — Son 200 satır:"
          echo "==============================================="
          tail -200 buildozer_full.log
          echo "==============================================="
          echo "📋 Log dosyası: buildozer_full.log"

      - name: Başarılı Olursa bin/ Listele
        if: steps.build.outcome == 'success'
        run: |
          echo "✅ DERLEME BAŞARILI"
          ls -la bin/ || echo "bin/ boş"
          find . -name "*.apk" -type f 2>/dev/null || echo "APK yok"

      - name: Log Dosyasını Yükle (Her Durumda)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: buildozer_full.log
          retention-days: 7

      - name: APK Yükle
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PansiyonNobet-APK
          path: |
            bin/*.apk
            **/*.apk
          retention-days: 90
          if-no-files-found: warn
