name: APK Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bağımlılıkları Kur
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf \
            libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Buildozer Önbelleği
        uses: actions/cache@v3
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}
      - name: APK Derle
        run: |
          yes | buildozer -v android debug
      - name: APK Yükle
        uses: actions/upload-artifact@v4
        with:
          name: PansiyonNobet-APK
          path: bin/*.apk
          retention-days: 90
